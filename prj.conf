CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CAN=y
CONFIG_SPI=n
CONFIG_MICROROS=y

CONFIG_MAIN_STACK_SIZE=50000
CONFIG_MAIN_THREAD_PRIORITY=4
# CONFIG_MICROROS_TRANSPORT_CANFD=y
CONFIG_CAN_FD_MODE=y
CONFIG_CANFD_MAX_DLC=15
CONFIG_CAN_TX_QUEUE_SIZE=3
CONFIG_CANFD_BITRATE_DATA=1000000
CONFIG_CANFD_BITRATE=2000000


CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_PTHREAD_IPC=n

CONFIG_POSIX_API=y
CONFIG_POSIX_CLOCK=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=0
